name: Android build

on:
  push:
    branches: [master, 'android-*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compile debug APK
        shell: bash
        run: |
          set -uo pipefail
          LOG_PATH="$RUNNER_TEMP/gradle.log"

          # Surface failures as annotations, which are readable without opening the full log.
          if ! bash gradlew :app:assembleDebug --no-daemon 2>&1 | tee "$LOG_PATH"; then
            grep -E -A6 'error:|What went wrong' "$LOG_PATH" | grep -v '^--' | head -n 10 | sed 's/^/::error::/' || true
            exit 1
          fi
