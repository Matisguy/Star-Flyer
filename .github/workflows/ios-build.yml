name: iOS build

on:
  push:
    branches: [master, 'ios-*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: cmake -S ios -B build/ios -G Xcode

      - name: Compile for iOS devices (unsigned)
        run: cmake --build build/ios --config Release -- -sdk iphoneos CODE_SIGNING_ALLOWED=NO
